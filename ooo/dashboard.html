<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة الأحياء</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .welcome-box { background-color: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); max-width: 450px; width: 100%; }
        h1 { color: #ff9800; margin-bottom: 15px; font-size: 24px; }
        p { color: #cccccc; font-size: 16px; margin-bottom: 25px; }
        .btn-logout { display: inline-block; padding: 10px 20px; background-color: #e53935; color: #ffffff; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .btn-logout:hover { background-color: #c62828; }
    </style>
</head>
<body>
    <div class="welcome-box">
        <h1>أهلاً بك يا بطل في منصة الأحياء! 🚀</h1>
        <p>تم تسجيل الدخول أو إنشاء الحساب بنجاح، ومنور لوحة التحكم.</p>
        <a href="index.html" class="btn-logout">تسجيل الخروج</a>
    </div>
</body>
</html>
